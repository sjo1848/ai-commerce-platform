name: r2-4-multi-room-patcher-v4

on:
  push:
    branches:
      - feat/acp-2.6.9-r2.4-multi-room-conversation
    paths:
      - .github/workflows/r2-4-multi-room-patcher-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/acp-2.6.9-r2.4-multi-room-conversation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reapply implementation and repair regression harness
        shell: python
        run: |
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/r2-4-multi-room-patcher.yml').read_text()
          start_marker = '      - name: Apply R2.4 runtime patch\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Install and run QA\n'
          block = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(script, '<r2-4-original-patch>', 'exec'), {'__name__': '__main__'})

          p = Path('src/core/conversation-state.ts')
          text = p.read_text()
          text, count = re.subn(
            r'function syncSingleSelectionAlias\(state: ConversationState\): void \{\n  if \(state\.selectedRoomIds\.length === 1\) state\.selectedRoomId = state\.selectedRoomIds\[0\];\n  else delete state\.selectedRoomId;\n\}',
            'function syncSingleSelectionAlias(state: ConversationState): void {\n  const onlyRoomId = state.selectedRoomIds.length === 1 ? state.selectedRoomIds[0] : undefined;\n  if (onlyRoomId) state.selectedRoomId = onlyRoomId;\n  else delete state.selectedRoomId;\n}',
            text,
            count=1,
          )
          if count != 1: raise SystemExit(f'alias replacement count={count}')
          p.write_text(text)

          p = Path('src/core/llm-model.ts')
          text = p.read_text()
          text, count = re.subn(
            r'  if \(value\.requestedRoomCount === null \|\| Number\.isInteger\(value\.requestedRoomCount\)\) \{\n    patch\.requestedRoomCount = value\.requestedRoomCount as number \| null;\n  \}',
            '  if (value.requestedRoomCount !== undefined) {\n    if (value.requestedRoomCount === null) patch.requestedRoomCount = null;\n    else if (Number.isInteger(value.requestedRoomCount) && Number(value.requestedRoomCount) >= 1 && Number(value.requestedRoomCount) <= 10) {\n      patch.requestedRoomCount = Number(value.requestedRoomCount);\n    } else return undefined;\n  }',
            text,
            count=1,
          )
          if count != 1: raise SystemExit(f'requestedRoomCount replacement count={count}')
          text, count = re.subn(
            r'        if \(!Number\.isInteger\(item\.guests\)\) return undefined;',
            '        if (!Number.isInteger(item.guests) || Number(item.guests) < 1 || Number(item.guests) > 20) return undefined;',
            text,
            count=1,
          )
          if count != 1: raise SystemExit(f'occupancy replacement count={count}')
          text = text.replace(
            'For one displayed option by position, selectedRoomIndex is the ONE-BASED index.',
            'For one displayed option by position, selectedRoomIndex is the ONE-BASED list position/index.',
            1,
          )
          p.write_text(text)

          p = Path('test/multi-room-conversation-r2.4.test.mjs')
          text = p.read_text()
          text = text.replace('function groundedAvailability(guests = 5) {', 'function groundedAvailability(guests = 5, memoryScope = scope) {', 1)
          text = text.replace('semanticMemory: { revision: 0, stay: {}, preferences: [], scope }', 'semanticMemory: { revision: 0, stay: {}, preferences: [], scope: memoryScope }', 1)
          text = text.replace('assert.match(systemPrompt, /roomNumber\\\\\\":\\\\\\"101/);', 'assert.match(systemPrompt, /roomNumber":"101/);', 1)
          text = text.replace(
            'await stateStore.put(context.session.id, groundedAvailability(5));',
            'await stateStore.put(context.session.id, groundedAvailability(5, { tenantId: tenant.id, actorId: actor.id, sessionId: context.session.id }));',
            1,
          )
          text = text.replace(
            'await stateStore.put(context.session.id, groundedAvailability(4));',
            'await stateStore.put(context.session.id, groundedAvailability(4, { tenantId: tenant.id, actorId: actor.id, sessionId: context.session.id }));',
            1,
          )
          p.write_text(text)

      - name: Install and run QA
        run: |
          npm ci
          npm run qa
          node --check scripts/staging-e2e-reservation.mjs
          npx wrangler deploy --dry-run

      - name: Commit runtime and tests; self-remove patchers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r2-4-multi-room-patcher.yml .github/workflows/r2-4-multi-room-patcher-v2.yml .github/workflows/r2-4-multi-room-patcher-v3.yml .github/workflows/r2-4-multi-room-patcher-v4.yml
          git add src test .orchestration/contracts/ACP-2.6.9-R2-NATURAL-RECEPTIONIST.md
          git commit -m "feat(r2.4): add grounded multi-room conversation state"
          git push origin HEAD:feat/acp-2.6.9-r2.4-multi-room-conversation
