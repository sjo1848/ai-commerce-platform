name: r2-4-multi-room-patcher-v2

on:
  push:
    branches:
      - feat/acp-2.6.9-r2.4-multi-room-conversation
    paths:
      - .github/workflows/r2-4-multi-room-patcher-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/acp-2.6.9-r2.4-multi-room-conversation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reapply original patch and harden parser
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/r2-4-multi-room-patcher.yml').read_text()
          start_marker = '      - name: Apply R2.4 runtime patch\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Install and run QA\n'
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('cannot extract original R2.4 patch script')
          block = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = block.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script, '<r2-4-original-patch>', 'exec'), {'__name__': '__main__'})

          p = Path('src/core/conversation-state.ts')
          text = p.read_text()
          old = '''function syncSingleSelectionAlias(state: ConversationState): void {
            if (state.selectedRoomIds.length === 1) state.selectedRoomId = state.selectedRoomIds[0];
            else delete state.selectedRoomId;
          }'''.replace('          ', '')
          new = '''function syncSingleSelectionAlias(state: ConversationState): void {
            const onlyRoomId = state.selectedRoomIds.length === 1 ? state.selectedRoomIds[0] : undefined;
            if (onlyRoomId) state.selectedRoomId = onlyRoomId;
            else delete state.selectedRoomId;
          }'''.replace('          ', '')
          if old not in text:
              raise SystemExit('single-selection alias target missing')
          p.write_text(text.replace(old, new, 1))

          p = Path('src/core/llm-model.ts')
          text = p.read_text()
          old = '''  if (value.requestedRoomCount === null || Number.isInteger(value.requestedRoomCount)) {
            patch.requestedRoomCount = value.requestedRoomCount as number | null;
          }
          if (value.roomOccupancy !== undefined) {'''.replace('          ', '')
          new = '''  if (value.requestedRoomCount !== undefined) {
            if (value.requestedRoomCount === null) patch.requestedRoomCount = null;
            else if (Number.isInteger(value.requestedRoomCount) && Number(value.requestedRoomCount) >= 1 && Number(value.requestedRoomCount) <= 10) {
              patch.requestedRoomCount = Number(value.requestedRoomCount);
            } else return undefined;
          }
          if (value.roomOccupancy !== undefined) {'''.replace('          ', '')
          if old not in text:
              raise SystemExit('requestedRoomCount parser target missing')
          text = text.replace(old, new, 1)
          old = '''        if (!Number.isInteger(item.guests)) return undefined;
                const refs = [typeof item.roomId === "string", typeof item.roomNumber === "string", Number.isInteger(item.roomIndex)].filter(Boolean).length;'''.replace('          ', '')
          new = '''        if (!Number.isInteger(item.guests) || Number(item.guests) < 1 || Number(item.guests) > 20) return undefined;
                const refs = [typeof item.roomId === "string", typeof item.roomNumber === "string", Number.isInteger(item.roomIndex)].filter(Boolean).length;'''.replace('          ', '')
          if old not in text:
              raise SystemExit('occupancy guest parser target missing')
          p.write_text(text.replace(old, new, 1))

      - name: Install and run QA
        run: |
          npm ci
          npm run qa
          node --check scripts/staging-e2e-reservation.mjs
          npx wrangler deploy --dry-run

      - name: Commit runtime and tests; self-remove patchers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r2-4-multi-room-patcher.yml .github/workflows/r2-4-multi-room-patcher-v2.yml
          git add src test .orchestration/contracts/ACP-2.6.9-R2-NATURAL-RECEPTIONIST.md
          git commit -m "feat(r2.4): add grounded multi-room conversation state"
          git push origin HEAD:feat/acp-2.6.9-r2.4-multi-room-conversation
