name: Regenerate lockfile

on:
  push:
    branches:
      - feature/e1-hms-service-binding
    paths:
      - .github/workflows/regen-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/e1-hms-service-binding
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change"
            exit 0
          fi
          git commit -m "build(core): add reproducible npm lockfile"
          git push origin HEAD:feature/e1-hms-service-binding
