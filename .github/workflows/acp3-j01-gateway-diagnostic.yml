name: ACP-3 J01 consumed-call observability diagnostic

on:
  push:
    branches:
      - feature/acp-3.0.8-implementation-foundation
    paths:
      - .github/workflows/acp3-j01-gateway-diagnostic.yml

permissions:
  contents: read

jobs:
  recover-existing-worker-telemetry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_OBSERVABILITY_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVABILITY_API_TOKEN }}
      WORKER_NAME: ai-commerce-agent-core
      FROM_MS: '1789340880000'
      TO_MS: '1789341120000'
    steps:
      - uses: actions/checkout@v4

      - name: Verify dedicated Workers Observability credential presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID//[[:space:]]/}"
          test -n "${CLOUDFLARE_OBSERVABILITY_API_TOKEN//[[:space:]]/}"
          test -n "${WORKER_NAME//[[:space:]]/}"

      - name: Query exact consumed-inference time window read-only
        shell: bash
        run: |
          set -euo pipefail
          node scripts/query-workers-observability.mjs "$FROM_MS" "$TO_MS" > /tmp/acp3-j01-workers-observability.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('/tmp/acp3-j01-workers-observability.json','utf8'));
          if (payload?.success !== true) throw new Error('Workers Observability query did not return success=true');
          const events = Array.isArray(payload.result) ? payload.result : payload?.result?.events;
          const safe = {
            success: true,
            eventCount: Array.isArray(events) ? events.length : null,
            resultKeys: payload.result && typeof payload.result === 'object' && !Array.isArray(payload.result) ? Object.keys(payload.result).sort() : undefined,
          };
          writeFileSync('/tmp/acp3-j01-workers-observability-summary.json', JSON.stringify(safe, null, 2));
          NODE

      - name: Preserve temporary historical telemetry for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acp3-j01-workers-observability-${{ github.run_id }}
          path: |
            /tmp/acp3-j01-workers-observability.json
            /tmp/acp3-j01-workers-observability-summary.json
          if-no-files-found: warn
          retention-days: 1
