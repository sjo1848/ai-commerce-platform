name: r2-3-type-annotation-fix

on:
  push:
    branches:
      - fix/acp-2.6.9-r2.3-late-critic-rework
    paths:
      - .github/workflows/r2-3-type-annotation-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/acp-2.6.9-r2.3-late-critic-rework
      - name: Add explicit boolean annotations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/core/conversation-state.ts')
          text = p.read_text()
          text = text.replace('const coordinatedNegated = previousNegated &&', 'const coordinatedNegated: boolean = previousNegated &&')
          text = text.replace('const negated = directlyNegated || coordinatedNegated;', 'const negated: boolean = directlyNegated || coordinatedNegated;')
          p.write_text(text)
          PY
      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r2-3-type-annotation-fix.yml
          git add src/core/conversation-state.ts
          git commit -m "fix(r2.3): type coordinated clear negation"
          git push origin HEAD:fix/acp-2.6.9-r2.3-late-critic-rework
