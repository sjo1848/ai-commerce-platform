name: core-ci

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked toolchain
        run: npm ci
      - name: Typecheck and tests
        run: npm run qa
      - name: Validate Cloudflare Worker config
        run: npx wrangler deploy --dry-run
