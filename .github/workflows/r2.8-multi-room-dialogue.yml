name: R2.8 multi-room dialogue

on:
  workflow_dispatch:
  push:
    branches:
      - feat/acp-2.6.9-r2.8.4-multi-room-dialogue

permissions:
  contents: read

concurrency:
  group: ai-commerce-staging
  cancel-in-progress: false

jobs:
  dialogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: ai-commerce-agent-core
      EXPECTED_MODEL: '@cf/meta/llama-3.3-70b-instruct-fp8-fast'
      R28_START: '2030-01-01'
      R28_END: '2030-01-03'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked toolchain
        run: npm ci

      - name: Foundation gate
        run: npm run qa

      - name: Validate R2.8.4 harness
        run: |
          node --check scripts/r2.8-multi-room-dialogue.mjs
          node --check scripts/query-workers-observability.mjs
          node --check scripts/count-model-telemetry.mjs
          node --check scripts/count-audit-events.mjs

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler whoami

      - name: Deploy exact R2.8.4 head to staging
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run
          npx wrangler deploy | tee /tmp/r28-r4-deploy.log
          version_id="$(node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('/tmp/r28-r4-deploy.log', 'utf8');
          const matches = [...text.matchAll(/Current Version ID:\s*([0-9a-f-]{36})/gi)];
          const value = matches.at(-1)?.[1];
          if (!value) process.exit(2);
          process.stdout.write(value);
          NODE
          )"
          test -n "$version_id"
          echo "R28_VERSION_ID=$version_id" >> "$GITHUB_ENV"
          echo "Exact staging Version ID: $version_id"

      - name: Resolve workers.dev URL
        shell: bash
        run: |
          set -euo pipefail
          payload="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(printf '%s' "$payload" | node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync(0,"utf8"));
            if (!p?.success || !p?.result?.subdomain) process.exit(2);
            process.stdout.write(p.result.subdomain);
          ')"
          echo "AI_COMMERCE_STAGING_URL=https://$WORKER_NAME.$subdomain.workers.dev" >> "$GITHUB_ENV"

      - name: Wait for exact staging deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            status="$(curl -sS --max-time 10 -o /tmp/r28-r4-root.html -w '%{http_code}' "$AI_COMMERCE_STAGING_URL/" || true)"
            if [[ "$status" == 2* ]]; then
              echo "Agent Core ready on attempt $attempt ($status)."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/r28-r4-root.html >&2 || true
          exit 1

      - name: Prove persisted Workers Logs attachment
        shell: bash
        run: |
          set -euo pipefail
          log_from_ms="$(node -e 'process.stdout.write(String(Date.now()-5000))')"
          echo "R28_LOG_FROM_MS=$log_from_ms" >> "$GITHUB_ENV"
          probe_path="/__r28-observability-probe?run=${GITHUB_RUN_ID}"
          probe_status="$(curl -sS --max-time 10 -X POST \
            -o /tmp/r28-r4-observability-probe.txt \
            -w '%{http_code}' \
            "$AI_COMMERCE_STAGING_URL$probe_path" || true)"
          if [[ "$probe_status" != "404" ]]; then
            echo "R2.8.4 OBSERVABILITY_INVALID: persisted-log probe expected 404, got $probe_status" >&2
            cat /tmp/r28-r4-observability-probe.txt >&2 || true
            exit 1
          fi

          attached=0
          for attempt in $(seq 1 20); do
            to_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
            if node scripts/query-workers-observability.mjs "$log_from_ms" "$to_ms" "$probe_path" > /tmp/r28-r4-probe-logs.json; then
              if grep -Fq "$probe_path" /tmp/r28-r4-probe-logs.json; then
                attached=1
                echo "Persisted Workers Logs attachment proved on attempt $attempt."
                break
              fi
            else
              if [[ "$attempt" -eq 1 ]]; then
                echo "R2.8.4 OBSERVABILITY_INVALID: Workers Observability API query failed; verify API token has Workers Observability Write permission" >&2
                exit 1
              fi
            fi
            sleep 3
          done
          if [[ "$attached" -ne 1 ]]; then
            echo "R2.8.4 OBSERVABILITY_INVALID: persisted Workers Logs did not ingest the non-LLM POST probe" >&2
            cat /tmp/r28-r4-probe-logs.json >&2 || true
            exit 1
          fi

      - name: Real-model natural multi-room dialogue
        shell: bash
        run: |
          set -euo pipefail
          test -n "$R28_LOG_FROM_MS"

          set +e
          node scripts/r2.8-multi-room-dialogue.mjs > /tmp/r28-r4-report.json 2>&1
          DIALOGUE_CODE=$?
          set -e

          evidence_ready=0
          for attempt in $(seq 1 20); do
            to_ms="$(node -e 'process.stdout.write(String(Date.now()))')"
            node scripts/query-workers-observability.mjs "$R28_LOG_FROM_MS" "$to_ms" > /tmp/r28-r4-persisted-logs.json
            MODEL_TELEMETRY="$(node scripts/count-model-telemetry.mjs /tmp/r28-r4-persisted-logs.json)"
            AUDIT_TELEMETRY="$(node scripts/count-audit-events.mjs /tmp/r28-r4-persisted-logs.json)"
            model_count="$(MODEL_TELEMETRY="$MODEL_TELEMETRY" node -e 'process.stdout.write(String(JSON.parse(process.env.MODEL_TELEMETRY).modelInferences + JSON.parse(process.env.MODEL_TELEMETRY).modelFallbacks))')"
            audit_count="$(AUDIT_TELEMETRY="$AUDIT_TELEMETRY" node -e 'process.stdout.write(String(JSON.parse(process.env.AUDIT_TELEMETRY).auditEvents))')"
            if [[ "$model_count" -gt 0 && "$audit_count" -gt 0 ]]; then
              evidence_ready=1
              echo "$MODEL_TELEMETRY" > /tmp/r28-r4-model-telemetry.json
              echo "$AUDIT_TELEMETRY" > /tmp/r28-r4-audit-telemetry.json
              echo "Persisted model+audit evidence available on attempt $attempt."
              break
            fi
            sleep 3
          done

          echo '--- multi-room dialogue report ---'
          cat /tmp/r28-r4-report.json || true
          echo '--- persisted model telemetry ---'
          cat /tmp/r28-r4-model-telemetry.json || true
          echo
          echo '--- persisted audit telemetry ---'
          cat /tmp/r28-r4-audit-telemetry.json || true
          echo

          if [[ "$evidence_ready" -ne 1 ]]; then
            echo "R2.8.4 OBSERVABILITY_INVALID: persisted Workers Logs never exposed model and audit evidence" >&2
            exit 1
          fi
          if [[ "$DIALOGUE_CODE" -ne 0 ]]; then exit "$DIALOGUE_CODE"; fi

          MODEL_TELEMETRY="$(cat /tmp/r28-r4-model-telemetry.json)"
          AUDIT_TELEMETRY="$(cat /tmp/r28-r4-audit-telemetry.json)"

          EXPECTED_MODEL="$EXPECTED_MODEL" MODEL_TELEMETRY="$MODEL_TELEMETRY" REPORT_PATH=/tmp/r28-r4-report.json node - <<'NODE'
          const fs = require('fs');
          const telemetry = JSON.parse(process.env.MODEL_TELEMETRY);
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
          const sessionId = report.multiRoomSessionId;
          if (!sessionId) throw new Error('missing multi-room session id');
          if (telemetry.models.length !== 1 || telemetry.models[0] !== process.env.EXPECTED_MODEL) {
            throw new Error(`model mismatch: ${JSON.stringify(telemetry.models)}`);
          }
          const routeInferences = telemetry.inferences.filter((item) => item.sessionId === sessionId && item.label === 'agent_core_route');
          const routeFallbacks = telemetry.fallbacks.filter((item) => item.sessionId === sessionId && item.label === 'agent_core_route');
          if (routeInferences.length < 2) throw new Error(`insufficient real-model route evidence for multi-room session: ${routeInferences.length}`);
          if (routeFallbacks.length > 0) {
            throw new Error(`historical R2.4 probe depended on deterministic route fallback: ${JSON.stringify(routeFallbacks)}`);
          }
          if (telemetry.totalInputTokens <= 0 || telemetry.totalOutputTokens <= 0) throw new Error('missing token evidence');
          console.log(JSON.stringify({
            event: 'ACP_R2_8_4_MODEL_ROUTE_PROOF',
            sessionId,
            routeInferences: routeInferences.length,
            routeFallbacks: routeFallbacks.length,
            model: telemetry.models[0],
          }));
          NODE

          AUDIT_TELEMETRY="$AUDIT_TELEMETRY" REPORT_PATH=/tmp/r28-r4-report.json node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(process.env.AUDIT_TELEMETRY);
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
          const sessionId = report.multiRoomSessionId;
          const events = audit.events.filter((event) => event.sessionId === sessionId);
          if (!events.some((event) => event.toolId === 'hms.checkAvailability' && event.status === 'succeeded')) {
            throw new Error('missing authoritative C06 availability audit');
          }
          if (!events.some((event) => event.toolId === 'hms.createMultiReservation' && event.status === 'approval_required')) {
            throw new Error(`multi-room dialogue did not reach composite R2.5 HITL boundary: ${JSON.stringify(events)}`);
          }
          if (events.some((event) => event.toolId === 'hms.createReservation' && ['approval_required', 'succeeded', 'replayed'].includes(event.status))) {
            throw new Error('multi-room intent collapsed into single-room reservation path');
          }
          if (events.some((event) => /createReservation|createMultiReservation|cancelReservation|cancelMultiReservation/.test(String(event.toolId)) && ['succeeded', 'replayed'].includes(event.status))) {
            throw new Error('R2.8.4 executed a mutation; only unconsumed HITL is allowed');
          }
          console.log(JSON.stringify({
            event: 'ACP_R2_8_4_COMPOSITE_AUDIT_PROOF',
            sessionId,
            compositeApprovalRequired: true,
            mutationSucceeded: false,
          }));
          NODE

          grep -q 'ACP_R2_8_MULTI_ROOM_DIALOGUE_PASS' /tmp/r28-r4-report.json
          echo 'ACP_R2_8_4_MULTI_ROOM_DIALOGUE_PASS'

      - name: Preserve R2.8.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2.8-multi-room-dialogue-${{ github.run_id }}
          path: |
            /tmp/r28-r4-deploy.log
            /tmp/r28-r4-report.json
            /tmp/r28-r4-observability-probe.txt
            /tmp/r28-r4-probe-logs.json
            /tmp/r28-r4-persisted-logs.json
            /tmp/r28-r4-model-telemetry.json
            /tmp/r28-r4-audit-telemetry.json
          if-no-files-found: warn
          retention-days: 14
